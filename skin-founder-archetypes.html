<style>
/* ── SKIN OS design tokens — dark (default) ── */
:root{
  --bg:#0A0B0E; --bg2:#131419; --bg3:#1B1D23; --bg4:#23252C;
  --border:rgba(230,230,224,0.10); --border-h:rgba(230,230,224,0.18); --border-active:rgba(230,230,224,0.30);
  --text:#E6E6E0; --text-muted:#8B8884; --text-dim:#4C4A45;
  --obsidian:#0A0B0E; --bone:#E6E6E0; --sand:#CFC6B6; --clay:#B36845; --copper:#D6844A; --slate:#697386;
  --accent:var(--copper);
  --glow:rgba(214,132,74,0.06); --shadow:rgba(0,0,0,0.55);
  --nhg-display:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --nhg-text:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:var(--nhg-text); --serif:var(--nhg-display); --sans:var(--nhg-display);
  --radius-sm:2px; --radius-md:6px; --radius-lg:10px; --topbar-h:60px;
}
/* ── light mode (Bone) — warm & human, for editorial ── */
:root.day{
  --bg:#F6F4EF; --bg2:#FFFFFF; --bg3:#F1ECE2; --bg4:#E7DFD2;
  --border:rgba(11,11,13,0.12); --border-h:rgba(11,11,13,0.20); --border-active:rgba(11,11,13,0.34);
  --text:#0B0B0D; --text-muted:#726C62; --text-dim:#B3ABA0;
  --obsidian:#0B0B0D; --bone:#F6F4EF; --sand:#E7DFD2; --clay:#C77D5A; --copper:#A65A2A; --slate:#4A5568;
  --accent:var(--copper);
  --glow:rgba(166,90,42,0.06); --shadow:rgba(11,11,13,0.16);
}
/* ── dark mode (Obsidian) — focused & elevated, for action ── */
:root.dark{
  --bg:#0A0B0E; --bg2:#131419; --bg3:#1B1D23; --bg4:#23252C;
  --border:rgba(230,230,224,0.10); --border-h:rgba(230,230,224,0.18); --border-active:rgba(230,230,224,0.30);
  --text:#E6E6E0; --text-muted:#8B8884; --text-dim:#4C4A45;
  --obsidian:#0A0B0E; --bone:#E6E6E0; --sand:#CFC6B6; --clay:#B36845; --copper:#D6844A; --slate:#697386;
  --accent:var(--copper);
  --glow:rgba(214,132,74,0.06); --shadow:rgba(0,0,0,0.55);
}
/* ── Self-host option (B): uncomment and drop your licensed .woff2 files in /fonts ──
@font-face{font-family:'Neue Haas Grotesk Display Pro';src:url('fonts/NeueHaasGroteskDisplayPro-55Roman.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Neue Haas Grotesk Display Pro';src:url('fonts/NeueHaasGroteskDisplayPro-65Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Neue Haas Grotesk Display Pro';src:url('fonts/NeueHaasGroteskDisplayPro-75Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Neue Haas Grotesk Display Pro';src:url('fonts/NeueHaasGroteskDisplayPro-56Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Neue Haas Grotesk Text Pro';src:url('fonts/NeueHaasGroteskTextPro-55Roman.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Neue Haas Grotesk Text Pro';src:url('fonts/NeueHaasGroteskTextPro-65Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
   ──────────────────────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:var(--topbar-h);border-bottom:1px solid var(--border);flex-shrink:0;transition:border-color .4s}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .logo{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:.12em}
.brand .sep{color:var(--text-dim)}
.brand .label{font-size:13px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
.topbar-meta{display:flex;align-items:center;gap:14px}
.meta-tag{font-size:12px;color:var(--text-dim);border:1px solid var(--border);padding:3px 8px;border-radius:2px;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text-muted);font-size:15px;flex-shrink:0;transition:border-color .2s,background .2s,color .2s,transform .35s ease}
.theme-toggle:hover{border-color:var(--border-h);background:var(--bg2);color:var(--text)}
.theme-toggle:active{transform:rotate(180deg)}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
:root.day .theme-toggle .icon-sun{display:block}
:root.day .theme-toggle .icon-moon{display:none}

/* ── SHELL ── */
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:52px 48px 40px;position:relative;overflow:hidden}
.wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 36%,var(--glow) 0%,transparent 60%);pointer-events:none;transition:background .4s}
.inner{width:100%;max-width:980px;position:relative;z-index:1}
.screen{display:none;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.screen.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;text-align:center}
.eyebrow span{color:var(--accent)}

/* ── COVER ── */
#cover{text-align:center;padding-top:14px}
#cover .eyebrow{margin-bottom:26px}
.hero-faces{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,52px);margin:4px 0 34px}
.hf{display:flex;flex-direction:column;align-items:center;gap:12px;animation:facein .75s both}
.hf:nth-child(1){animation-delay:.05s}
.hf:nth-child(3){animation-delay:.22s}
.hf-port{width:clamp(118px,21vw,168px);line-height:0;border-radius:50%;box-shadow:0 14px 40px var(--shadow);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.hf-port:hover{transform:translateY(-5px) scale(1.03)}
.hf-port svg{width:100%;height:auto;display:block}
.hf figcaption{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.vs-badge{font-family:var(--serif);font-style:normal;font-weight:700;font-size:clamp(22px,4.6vw,36px);letter-spacing:.02em;color:var(--accent);animation:facein .75s .14s both;padding-bottom:22px}
@keyframes facein{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.hero-title{font-family:var(--serif);font-size:clamp(42px,7.5vw,76px);font-weight:600;font-style:normal;line-height:.98;letter-spacing:-.035em;margin-bottom:22px}
.hero-title strong{font-weight:800;font-style:normal;display:block;color:var(--text)}
.hero-sub{font-family:var(--mono);font-size:15px;color:var(--text-muted);max-width:520px;line-height:1.8;margin:0 auto 40px}
.hero-sub b{color:var(--text)}

.btn{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:14px 30px;border-radius:var(--radius-sm);border:1px solid var(--border-active);background:transparent;color:var(--text);transition:border-color .18s,color .18s,background .18s,transform .18s}
.btn:hover{border-color:var(--text);color:var(--text);transform:translateY(-1px)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.primary:hover{opacity:.88;transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:default;transform:none;border-color:var(--border);color:var(--text-dim)}
.cover-meta{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:18px;letter-spacing:.06em}

/* ── QUIZ ── */
.prog{display:flex;align-items:center;gap:16px;margin-bottom:46px}
.prog-num{font-family:var(--mono);font-size:12px;color:var(--text-muted);white-space:nowrap;letter-spacing:.06em}
.prog-num b{color:var(--accent)}
.prog-track{flex:1;height:2px;background:var(--bg4)}
.prog-fill{height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.qblock{animation:swap .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.q-tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,46px);line-height:1.06;letter-spacing:-.025em;margin-bottom:36px;max-width:18ch}
.options{display:grid;gap:10px;max-width:720px}
.opt{display:flex;align-items:center;gap:18px;text-align:left;width:100%;cursor:pointer;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-md);padding:17px 20px;color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.5;transition:border-color .16s,background .16s,transform .16s}
.opt .ltr{font-family:var(--serif);font-weight:700;font-size:18px;font-style:normal;color:var(--accent);width:24px;flex-shrink:0;text-align:center}
.opt:hover{border-color:var(--border-h);background:var(--bg3);transform:translateX(4px)}
.opt.chosen{border-color:var(--accent);background:var(--bg3)}
.q-nav{margin-top:28px}
.backlink{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:6px 2px;transition:color .18s}
.backlink:hover{color:var(--accent)}
.backlink:disabled{opacity:.3;cursor:default}

/* ── RESULT ── */
#result{text-align:center}
.res-eyebrow{margin-bottom:20px}
.portrait{width:clamp(190px,34vw,260px);height:auto;margin:0 auto 8px;display:block;filter:drop-shadow(0 14px 36px var(--shadow))}
.res-match{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.res-name{font-family:var(--serif);font-weight:700;font-size:clamp(46px,11vw,100px);line-height:.94;letter-spacing:-.035em}
.res-name em{font-style:normal;font-weight:400;color:var(--accent)}
.res-arche{font-family:var(--serif);font-style:normal;font-weight:500;font-size:clamp(18px,2.8vw,26px);color:var(--text-muted);margin-top:14px;letter-spacing:-.01em}
.res-companies{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-top:14px}
.rule{height:1px;background:var(--border);margin:36px 0}
.res-body{display:grid;grid-template-columns:1.35fr 1fr;gap:48px;text-align:left;align-items:start}
@media(max-width:780px){.res-body{grid-template-columns:1fr;gap:30px}}
.res-blurb{font-family:var(--mono);font-size:clamp(16px,2.3vw,20px);line-height:1.6;color:var(--text);font-weight:400}
.res-motto{font-family:var(--serif);font-style:italic;font-size:clamp(20px,3vw,27px);color:var(--accent);margin-top:24px;border-left:2px solid var(--accent);padding-left:18px;line-height:1.25}
.res-motto-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);padding-left:20px;margin-top:6px}
.sidecard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 22px}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.03em;background:var(--bg3);border:1px solid var(--border);padding:6px 11px;border-radius:2px;color:var(--text-muted)}
.watch{font-family:var(--mono);font-size:13px;line-height:1.65;color:var(--text-muted)}
.breakdown{margin-top:42px;text-align:left}
.bd-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border-h);padding-bottom:10px;margin-bottom:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.bd-h span:last-child{color:var(--text-dim)}
.bar-row{display:flex;align-items:center;gap:16px;margin-bottom:13px}
.bar-name{width:clamp(118px,22vw,180px);font-family:var(--serif);font-style:normal;font-weight:500;font-size:clamp(15px,2.3vw,19px);letter-spacing:-.01em;flex-shrink:0}
.bar-track{flex:1;height:12px;background:var(--bg4);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:2px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.bar-pct{width:46px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--text)}
.res-cta{margin-top:46px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.cta-note{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.06em;width:100%;text-align:center;margin-top:4px}

/* ── BOTTOM BAR ── */
.bottom-bar{border-top:1px solid var(--border);padding:20px 48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;transition:border-color .4s}
.bottom-bar a{font-family:var(--mono);font-size:13px;color:var(--text-dim);text-decoration:none;letter-spacing:.05em;transition:color .15s}
.bottom-bar a:hover{color:var(--text-muted)}
.version{font-family:var(--mono);font-size:12px;color:var(--text-dim);letter-spacing:.08em}

.toast{position:fixed;left:50%;bottom:34px;translate:-50% 0;background:var(--bg3);border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:13px 22px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50}
.toast.show{opacity:1;transform:translateY(-6px)}

@media(max-width:820px){.topbar{padding:0 24px}.wrap{padding:36px 24px 32px}.bottom-bar{padding:16px 24px;flex-direction:column;gap:14px;text-align:center}.brand .label{display:none}.prog{margin-bottom:34px}}

/* ── v3.0 brand additions ── */
.brand{align-items:center;gap:9px}
.brand .logo{font-weight:800;letter-spacing:.01em}
.brand .sep{color:var(--text-dim);font-weight:400}
.topbar-mark{display:inline-flex;align-items:center;color:var(--text)}
.topbar-mark svg,.foot-mark svg,.cover-mark svg{display:block}
.cover-mark{display:flex;justify-content:center;color:var(--text);margin-bottom:20px}
.krule{width:42px;height:3px;background:var(--accent);border-radius:2px;margin:16px auto 0}
#cover .krule{margin-bottom:32px}
.foot-brand{display:flex;align-items:center;gap:15px;min-width:0}
.foot-mark{display:inline-flex;color:var(--text);flex-shrink:0}
.foot-div{width:1px;height:24px;background:var(--border);flex-shrink:0}
.foot-tagline{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--text);letter-spacing:-.01em}
.foot-right{display:flex;align-items:center;gap:22px;flex-shrink:0}
@media(max-width:820px){.foot-div{display:none}.foot-tagline{font-size:13px}.foot-brand{gap:10px;justify-content:center}.foot-right{justify-content:center}}

/* ── v3.1 — inline link, custom images, archetypes screen ── */
.link-inline{font:inherit;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link-inline:hover{opacity:.78}
.founder-img{border:1px solid var(--border)}
#archetypes{text-align:center}
.arch-title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5.5vw,54px);line-height:1.04;letter-spacing:-.03em;margin-bottom:16px}
.arch-sub{font-family:var(--mono);font-size:14px;color:var(--text-muted);max-width:600px;margin:0 auto 44px;line-height:1.7}
.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px;text-align:left}
.arch-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 22px;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.arch-card:hover{border-color:var(--border-h);transform:translateY(-3px)}
.arch-port{width:104px;height:104px;margin:0 auto 14px}
.arch-port svg,.arch-port img{width:100%;height:auto;display:block}
.arch-name{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:-.02em;text-align:center}
.arch-arche{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--accent);text-align:center;margin-top:3px}
.arch-co{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);text-align:center;margin:9px 0 15px}
.arch-traits{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:15px}
.arch-blurb{font-family:var(--mono);font-size:12.5px;line-height:1.62;color:var(--text-muted);margin-top:auto}
.arch-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:42px}
@media(max-width:560px){.arch-grid{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.wrap{padding-top:46px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="topbar-mark" data-skinmark="22"></span><span class="logo">SKIN</span><span class="sep">—</span><span class="label">Archetypes</span></div>
  <div class="topbar-meta">
    <span class="meta-tag">v2.1</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle day/night mode" onclick="toggleTheme()"><span class="icon-sun" aria-hidden="true">☀</span><span class="icon-moon" aria-hidden="true">☾</span></button>
  </div>
</header>
<main class="wrap"><div class="inner"><section class="screen active" id="archetypes"></section></div></main>
<footer class="bottom-bar">
  <div class="foot-brand"><span class="foot-mark" data-skinmark="26"></span><span class="foot-div"></span><span class="foot-tagline">Less AI-tool energy. More timeless founder operating brand.</span></div>
  <div class="foot-right"><a href="skin-founder-match.html">← Founder Match</a><span class="version">Archetypes v2.1</span></div>
</footer>
<script>
let _mid=0;
function skinMark(px){
  const id='sk'+(++_mid);
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" fill="currentColor" aria-hidden="true"><defs><mask id="${id}"><rect width="100" height="100" fill="#fff"/><path d="M50 25 L73 51 L61 51 L61 77 L39 77 L39 51 L27 51 Z" fill="#000"/><rect x="47" y="31" width="6" height="46" rx="3" fill="#fff"/></mask></defs><circle cx="50" cy="50" r="47" mask="url(#${id})"/></svg>`;
}
function fillMarks(){document.querySelectorAll('[data-skinmark]').forEach(el=>{el.innerHTML=skinMark(parseInt(el.dataset.skinmark,10)||24);});}
/* ============ DATA ============ */
const FOUNDERS = {
  jobs:{name:"Steve Jobs",first:"Steve",last:"Jobs",arche:"The Visionary Perfectionist",color:"#C16A3A",
    companies:"Apple · Pixar · NeXT",
    motto:"Stay hungry. Stay foolish.",
    blurb:"You don't read the market — you sense what people will want before they can name it. Taste is your unfair advantage, and you would sooner ship one perfect thing than ten that are merely fine. That obsession with craft makes you maddening to work for and impossible to ignore.",
    traits:["Product taste","Reality-bending vision","Perfectionism","Showmanship"],
    watch:"Blind spot: confusing \u201cmy standard\u201d with \u201cthe only standard.\u201d The intensity that inspires people can quietly burn out the ones who believe in you most.",
    face:{hair:'recede',hairColor:'#39362e',collar:'turtle',glasses:'round',mustache:false,mouth:'smile',back:null}},
  ma:{name:"Jack Ma",first:"Jack",last:"Ma",arche:"The Underdog Evangelist",color:"#6B7486",
    companies:"Alibaba · Ant Group",

/* ============ PORTRAITS ============ */
const PORTRAIT_PAL={
  dark:{sk:'#e8e6df',face:'#1d1d16',neck:'#191912',cloth:'#23231b',shirt:'#15150f',grin:'#2a2a20'},
  day :{sk:'#2c2922',face:'#ffffff',neck:'#efebe1',cloth:'#e7e3d7',shirt:'#f7f5ef',grin:'#dcd6c8'}
};
let _pid=0;
function portraitSVG(key,px,theme){
  const f=FOUNDERS[key],c=f.face,acc=f.color;
  const P=PORTRAIT_PAL[theme==='day'?'day':'dark'];
  const SK=P.sk,FACE=P.face,NECK=P.neck,CLOTH=P.cloth,SHIRT=P.shirt,GRIN=P.grin,HAIR=c.hairColor;
  const size=px||200,cid='clip-'+key+'-'+(++_pid);
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="${size}" height="${size}">`;
  s+=`<defs><clipPath id="${cid}"><circle cx="100" cy="100" r="92"/></clipPath></defs>`;
  s+=`<circle cx="100" cy="100" r="92" fill="${acc}" fill-opacity="0.12"/>`;
  s+=`<g clip-path="url(#${cid})">`;
  // back hair
  if(c.back==='bob'){s+=`<path d="M58 80 Q54 120 70 136 L84 136 Q70 110 76 84 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;s+=`<path d="M142 80 Q146 120 130 136 L116 136 Q130 110 124 84 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;}
  else if(c.back==='afro'){s+=`<ellipse cx="100" cy="82" rx="58" ry="55" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;}
  else if(c.back==='long'){
    s+=`<path d="M56 78 Q50 150 72 182 L86 182 Q72 132 78 86 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M144 78 Q150 150 128 182 L114 182 Q128 132 122 86 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;
  }
  // neck
  s+=`<path d="M90 136 L90 158 L110 158 L110 136 Z" fill="${NECK}" stroke="${SK}" stroke-width="2"/>`;
  // collar / shoulders
  if(c.collar==='turtle'){
    s+=`<path d="M76 150 Q100 168 124 150 L132 196 L68 196 Z" fill="${CLOTH}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M83 153 Q100 165 117 153" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
  }else if(c.collar==='crew'){
    s+=`<path d="M70 156 L62 196 L138 196 L130 156 Q100 150 70 156 Z" fill="${CLOTH}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M84 154 Q100 168 116 154" fill="none" stroke="${SK}" stroke-width="1.8"/>`;
  }else if(c.collar==='blouse'){
    s+=`<path d="M66 158 Q100 150 134 158 L140 196 L60 196 Z" fill="${CLOTH}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M84 155 Q100 167 116 155" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
  }else if(c.collar==='vneck'){
    s+=`<path d="M62 158 L54 196 L146 196 L138 158 Q100 149 62 158 Z" fill="${CLOTH}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M86 153 L100 180 L114 153" fill="${SHIRT}" stroke="${SK}" stroke-width="2"/>`;
  }else if(c.collar==='jacket'){
    s+=`<path d="M68 156 L60 196 L140 196 L132 156 Q100 150 68 156 Z" fill="${CLOTH}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M100 154 L100 196" fill="none" stroke="${SK}" stroke-width="1.5"/>`;
    s+=`<path d="M86 154 L100 168 L84 176" fill="none" stroke="${SK}" stroke-width="1.5"/>`;
    s+=`<path d="M114 154 L100 168 L116 176" fill="none" stroke="${SK}" stroke-width="1.5"/>`;
  }else if(c.collar==='suit'||c.collar==='suittie'){
    s+=`<path d="M58 160 L50 196 L150 196 L142 160 Q100 150 58 160 Z" fill="${CLOTH}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M86 152 L100 178 L114 152" fill="${SHIRT}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M86 152 L72 196" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
    s+=`<path d="M114 152 L128 196" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
    if(c.collar==='suittie'){
      s+=`<path d="M95 160 L105 160 L109 196 L91 196 Z" fill="${acc}" stroke="${SK}" stroke-width="1.4"/>`;
      s+=`<path d="M96 158 L104 158 L100 166 Z" fill="${acc}" stroke="${SK}" stroke-width="1.2"/>`;
    }
  }
  // head + ears
  s+=`<ellipse cx="63" cy="103" rx="6" ry="9" fill="${FACE}" stroke="${SK}" stroke-width="2"/>`;
  s+=`<ellipse cx="137" cy="103" rx="6" ry="9" fill="${FACE}" stroke="${SK}" stroke-width="2"/>`;
  s+=`<ellipse cx="100" cy="100" rx="37" ry="45" fill="${FACE}" stroke="${SK}" stroke-width="2.5"/>`;
  // front / top hair
  if(c.hair==='updo'){s+=`<path d="M64 82 Q66 56 100 54 Q134 56 136 82 Q126 64 100 64 Q74 64 64 82 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;s+=`<ellipse cx="100" cy="46" rx="17" ry="13" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;s+=`<path d="M74 72 Q100 62 126 72" fill="none" stroke="${SK}" stroke-width="1" stroke-opacity="0.5"/>`;}
  else if(c.hair==='recede'){s+=`<path d="M63 86 Q66 60 100 59 Q134 60 137 86 Q128 73 100 73 Q72 73 63 86 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;}
  else if(c.hair==='quiff'){s+=`<path d="M62 82 Q63 53 100 51 Q137 53 138 82 Q132 64 110 63 Q105 55 96 62 Q74 64 62 82 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;}
  else if(c.hair==='bald'){
    s+=`<path d="M64 104 Q60 90 68 80" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
    s+=`<path d="M136 104 Q140 90 132 80" fill="none" stroke="${SK}" stroke-width="1.6"/>`;
  }else if(c.hair==='longwave'){
    s+=`<path d="M61 86 Q64 54 100 53 Q136 54 139 86 Q132 66 100 66 Q68 66 61 86 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M100 56 Q96 70 99 84" fill="none" stroke="${SK}" stroke-width="1.4"/>`;
  }else if(c.hair==='afro'){
    s+=`<path d="M66 84 Q72 66 100 65 Q128 66 134 84" fill="none" stroke="${SK}" stroke-width="1.4" stroke-opacity="0.5"/>`;
  }else if(c.hair==='sidecomb'){
    s+=`<path d="M62 84 Q66 56 100 55 Q138 56 138 86 Q126 66 88 66 Q80 62 70 70 Q64 76 62 84 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M74 72 Q100 64 130 74" fill="none" stroke="${SK}" stroke-width="1.2" stroke-opacity="0.4"/>`;
  }else if(c.hair==='sidepart'){
    s+=`<path d="M62 84 Q64 54 100 53 Q138 54 138 86 Q128 64 90 64 Q84 60 76 66 Q68 72 62 84 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M86 57 Q92 72 88 86" fill="none" stroke="${SK}" stroke-width="1.2" stroke-opacity="0.55"/>`;
  }
  // beard
  if(c.beard){s+=`<path d="M62 106 Q64 150 100 156 Q136 150 138 106 Q132 134 100 138 Q68 134 62 106 Z" fill="${HAIR}" stroke="${SK}" stroke-width="2"/>`;}
  // features
  s+=`<g stroke="${SK}" stroke-width="2" fill="none" stroke-linecap="round">`;
  s+=`<path d="M78 90 Q86 86 94 90"/><path d="M106 90 Q114 86 122 90"/>`;
  s+=`<path d="M100 99 L100 110 L105 113"/>`;
  if(c.mouth==='smile'){s+=`<path d="M88 119 Q100 128 112 119"/>`;}
  else if(c.mouth==='warm'){s+=`<path d="M85 118 Q100 131 115 118"/>`;}
  s+=`</g>`;
  if(c.mouth==='grin'){
    s+=`<path d="M83 117 Q100 135 117 117 Q100 124 83 117 Z" fill="${GRIN}" stroke="${SK}" stroke-width="2"/>`;
    s+=`<path d="M86 119 Q100 122 114 119" fill="none" stroke="${SK}" stroke-width="1.2"/>`;
  }
  s+=`<circle cx="86" cy="97" r="2.7" fill="${SK}"/><circle cx="114" cy="97" r="2.7" fill="${SK}"/>`;
  if(c.mustache){s+=`<path d="M87 116 Q100 120 113 116 Q107 124 100 122 Q93 124 87 116 Z" fill="${HAIR}" stroke="${SK}" stroke-width="1.4"/>`;}
  if(c.glasses==='round'){s+=`<g stroke="${SK}" stroke-width="2" fill="none"><circle cx="86" cy="97" r="11"/><circle cx="114" cy="97" r="11"/><path d="M97 96 L103 96"/><path d="M75 95 L67 92"/><path d="M125 95 L133 92"/></g>`;}
  else if(c.glasses==='bigsquare'){s+=`<g stroke="${SK}" stroke-width="2" fill="none"><rect x="73" y="87" width="24" height="19" rx="4"/><rect x="103" y="87" width="24" height="19" rx="4"/><path d="M97 95 L103 95"/><path d="M73 93 L66 91"/><path d="M127 93 L134 91"/></g>`;}
  else if(c.glasses==='thinrect'){s+=`<g stroke="${SK}" stroke-width="1.8" fill="none"><rect x="75" y="90" width="21" height="13" rx="2"/><rect x="104" y="90" width="21" height="13" rx="2"/><path d="M96 95 L104 95"/><path d="M75 94 L67 92"/><path d="M125 94 L133 92"/></g>`;}
  s+=`</g></svg>`;
  return s;
}

/* ── Custom illustrations ──────────────────────────────────────────────
   To use your own art for a founder, set one of these on its entry above:
     img:      'illustrations/jobs.svg'      // used in both light & dark
     imgLight: 'illustrations/jobs-light.svg'// used only in light mode
     imgDark:  'illustrations/jobs-dark.png' // used only in dark mode
   SVG or PNG both work. With nothing set, the built-in line-portrait is used.
   Keep files in the same repo (same origin) so the PNG share-card export works. */
function founderArt(key,px,theme){
  const f=FOUNDERS[key];
  const src=(theme==='day'?(f.imgLight||f.img):(f.imgDark||f.img));
  if(src) return `<img class="founder-img" src="${src}" alt="${f.name}" width="${px}" height="${px}" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;display:block">`;
  return portraitSVG(key,px,theme);
}
/* ============ THEME ============ */
function currentTheme(){return document.documentElement.classList.contains('day')?'day':'dark';}
function setTheme(theme){const root=document.documentElement;root.classList.remove('day','dark');root.classList.add(theme);renderGrid();}
let _userToggled=false;
function toggleTheme(){_userToggled=true;setTheme(currentTheme()==='day'?'dark':'day');}
/* ============ GRID ============ */
function renderGrid(){
  const t=currentTheme();
  const cards=Object.keys(FOUNDERS).map(k=>{
    const f=FOUNDERS[k];
    return `<article class="arch-card"><div class="arch-port">${founderArt(k,120,t)}</div><div class="arch-name">${f.name}</div><div class="arch-arche">${f.arche}</div><div class="arch-co">${f.companies}</div><div class="arch-traits">${f.traits.map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="arch-blurb">${f.blurb}</p></article>`;
  }).join('');
  document.getElementById('archetypes').innerHTML=`
    <div class="eyebrow res-eyebrow">SKIN · <span>The Lineup</span></div>
    <div class="krule" style="margin:0 auto 22px"></div>
    <h1 class="arch-title">Twelve founders.<br>Twelve operating instincts.</h1>
    <p class="arch-sub">The twelve archetypes your answers are matched against — each a distinct way of building a company, across eras, industries, and continents. Dead or alive, every one of them played the game on their own terms.</p>
    <div class="arch-grid">${cards}</div>
    <div class="arch-cta"><a class="btn primary" href="skin-founder-match.html">Take the Assessment →</a><a class="btn" href="index.html">All SKIN modules</a></div>`;
}
(function init(){
  fillMarks();
  const sys=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'day':'dark';
  setTheme(sys);
  if(window.matchMedia){window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!_userToggled)setTheme(e.matches?'day':'dark');});}
})();
</script>
